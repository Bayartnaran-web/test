<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Библийн зан чанарын өөрийгөө шалгах тест</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2b2620;--mu:#7a7064;--ac:#2f6b4f;--ac2:#b4532a;--bd:#e6dfd3;--tr:#eee7da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1916;--card:#252220;--tx:#f0ebe3;--mu:#a69d90;--ac:#6fc29a;--ac2:#e48a5f;--bd:#3a3631;--tr:#34302b}}
:root[data-theme="dark"]{--bg:#1b1916;--card:#252220;--tx:#f0ebe3;--mu:#a69d90;--ac:#6fc29a;--ac2:#e48a5f;--bd:#3a3631;--tr:#34302b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.55}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 48px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px}
h1{font-size:1.5rem;margin:0 0 6px;line-height:1.3}
h2{font-size:1.15rem;margin:28px 0 10px}
.sub{color:var(--mu);margin:0 0 16px}
.quote{border-left:4px solid var(--ac);padding:8px 14px;margin:16px 0;background:var(--tr);border-radius:0 10px 10px 0}
.scale{display:grid;gap:6px;margin:12px 0;padding:0;list-style:none}
.scale li{display:flex;gap:10px}.scale b{width:22px;color:var(--ac)}
button{font:inherit;cursor:pointer}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:13px 22px;font-weight:600}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn:disabled{opacity:.4;cursor:default}
.top{display:flex;justify-content:space-between;color:var(--mu);font-size:.85rem;margin-bottom:8px}
.bar{height:8px;background:var(--tr);border-radius:8px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.sec-t{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ac);font-weight:700}
.q{font-size:1.2rem;font-weight:600;margin:8px 0 6px}
.ref{font-size:.82rem;color:var(--mu);margin-bottom:16px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--bg);color:var(--tx);border:2px solid var(--bd);border-radius:12px;padding:12px 14px}
.opt:hover{border-color:var(--ac)}
.opt.on{border-color:var(--ac);background:var(--tr)}
.opt b{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--ac);color:#fff;align-items:center;justify-content:center;flex:none}
.nav{display:flex;justify-content:space-between;margin-top:18px}
.row{margin:10px 0}
.row .l{display:flex;justify-content:space-between;gap:8px;font-size:.95rem}
.row .l span:last-child{font-weight:700;white-space:nowrap}
.row .t{height:10px;background:var(--tr);border-radius:8px;overflow:hidden;margin-top:4px}
.row .t i{display:block;height:100%;border-radius:8px}
.f i{background:var(--ac)}.m i{background:var(--ac2)}
.note{font-size:.82rem;color:var(--mu)}
.pill{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:20px;background:var(--tr);color:var(--mu);margin-left:6px}
.top3{display:grid;gap:8px}
.top3 div{display:flex;justify-content:space-between;padding:10px 14px;border-radius:12px;background:var(--tr)}
.ins{padding:10px 14px;border-radius:12px;background:var(--tr);margin:8px 0;font-size:.95rem}
textarea{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);min-height:80px}
.hide{display:none}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}
@media print{.acts{display:none}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const F=["Хайр","Баяр хөөр","Амар тайван","Удаан тэвчихүй","Эелдэг байдал","Сайхан сэтгэл","Итгэл","Номхон байдал","Биеэ захирах"];
const FE=["❤️","😊","🕊","⏳","🌿","🤍","✝️","🙏","🛡"];
const M=["Цэвэр бус хүсэл","Өөр зүйлд найдах","Үзэн ядалт / гомдол","Маргаан","Атаархал / харьцуулалт","Хилэгнэл","Талцал","Дураар дургилт","Өөрийгөө зөвтгөх"];
const ME=["🔥","💰","💢","⚔️","👁","🌋","✂️","🍷","🪞"];
const Q=[
["Намайг хайрладаггүй, бүр надад муу ханддаг хүний сайн сайхныг ч би хүсэж чаддаг.","Галат 5:22; Матт 5:44"],
["Би өөрт ашиггүй байсан ч бусдын төлөө сайн зүйл хийхэд бэлэн байдаг.","Галат 5:22; Матт 5:44"],
["Миний нөхцөл байдал муу байсан ч доторх баяр хөөрөө бүрэн алдахгүй байж чаддаг.","Галат 5:22; Матт 5:11–12"],
["Миний баяр хөөр зөвхөн мөнгө, амжилт, хүмүүсийн магтаалаас хамаардаггүй.","Галат 5:22; Матт 5:11–12"],
["Маргаан гарсан үед би асуудлыг улам хурцатгахын оронд амар тайван болгохыг хичээдэг.","Галат 5:22; Матт 5:9"],
["Хэн нэгэн намайг буруутгасан үед би шууд дайрч хариулахгүй, эхлээд тайван байж чаддаг.","Галат 5:22; Матт 5:9"],
["Хүмүүс миний хүссэнээр хурдан өөрчлөгдөхгүй байсан ч би тэвчээртэй байж чаддаг.","Галат 5:22; Матт 5:39–41"],
["Нэг асуудал дахин дахин давтагдсан үед би шууд уурлаж, бууж өгдөггүй.","Галат 5:22; Матт 5:39–41"],
["Би хүмүүстэй, ялангуяа надад хэрэггүй хүмүүстэй ч хүндэтгэлтэй харилцдаг.","Галат 5:22; Матт 5:5, 5:39"],
["Миний зөв байсан ч бусдыг доромжлохгүйгээр үнэнийг хэлж чаддаг.","Галат 5:22; Матт 5:5, 5:39"],
["Бусдын зовлонг хараад “надад хамаагүй” гэж өнгөрөхөөс илүү туслахыг хүсдэг.","Галат 5:22; Матт 6:1–4"],
["Хэн ч мэдэхгүй байсан ч сайн зүйл хийх хүсэл надад байдаг.","Галат 5:22; Матт 6:1–4"],
["Би нөхцөл байдалд биш, Шүтээний үгэнд найдахыг сонгодог.","Галат 5:22; Матт 6:25–34"],
["Ирээдүй тодорхойгүй байсан ч санаа зовнилдоо захирагдалгүйгээр Шүтээнд итгэж чаддаг.","Галат 5:22; Матт 6:25–34"],
["Би өөрийн бурууг бусдад тайлбарлаж зөвтгөхийн оронд хүлээн зөвшөөрч чаддаг.","Галат 5:23; Матт 5:3–5"],
["Би бусдын зөвлөгөө, засалтыг шууд эсэргүүцэхгүй сонсож чаддаг.","Галат 5:23; Матт 5:3–5"],
["Би хүссэн зүйлээ хүссэн үедээ хийхээс илүү зөв зүйлээ сонгож чаддаг.","Галат 5:23; Матт 5:27–30; 6:19–24"],
["Уур, хүсэл тачаал, мөнгө, хоол, зугаа цэнгэл, утас/интернет зэрэг зүйлс миний дээр захирч эхлэхэд би өөрийгөө зогсоож чаддаг.","Галат 5:23; Матт 5:27–30; 6:19–24"],
["Би зохисгүй бэлгийн бодол, дүрслэл, хүсэлдээ удаан хугацаагаар автагддаг.","Галат 5:19; Матт 5:27–30"],
["Хэн ч мэдэхгүй үед би хүсэл тачаалаа зөвтгөж, түүндээ бууж өгдөг.","Галат 5:19; Матт 5:27–30"],
["Шүтээнээс илүү мөнгө, байр суурь, хүмүүсийн үнэлгээ, эд зүйлс надад аюулгүй байдлыг өгдөг мэт санагддаг.","Галат 5:20; Матт 6:19–24"],
["Шүтээний хүслээс илүү өөрийн хүсэл, ашиг сонирхлоо хамгаалах хандлага надад байдаг.","Галат 5:20; Матт 6:19–24"],
["Намайг гомдоосон хүнийг дотроо удаан хугацаанд үзэн ядаж явдаг.","Галат 5:20; Матт 5:21–24, 5:43–48"],
["Би уучилсан мэт харагдавч дотроо тухайн хүний эсрэг гомдлоо хадгалдаг.","Галат 5:20; Матт 5:21–24, 5:43–48"],
["Би зөв гэдгээ батлахын тулд маргааныг үргэлжлүүлэх хандлагатай.","Галат 5:20; Матт 5:9, 5:39"],
["Бусад хүмүүсийн санал минийхтэй зөрөхөд би амархан хамгаалалтын байр суурь эзэлдэг.","Галат 5:20; Матт 5:9, 5:39"],
["Бусдын амжилтыг хараад баярлахаасаа илүү өөрийгөө түүнтэй харьцуулдаг.","Галат 5:20–21"],
["Бусад хүн надаас илүү хүлээн зөвшөөрөгдөхөд дотроо тавгүйтдэг.","Галат 5:20–21"],
["Уурласан үедээ би дараа нь харамсах үг, үйлдэл гаргадаг.","Галат 5:20; Матт 5:21–22"],
["Би уур бухимдлаа бусдад гаргах хандлагатай.","Галат 5:20; Матт 5:21–22"],
["Би хүмүүсийг “манай тал” ба “тэдний тал” гэж хуваан харах хандлагатай.","Галат 5:20"],
["Нэг хүний талаар бусдад ярьж, хүмүүсийн хооронд үл ойлголцол үүсгэж байсан тохиолдол надад байдаг.","Галат 5:20"],
["“Би хүсэж байна” гэсэн мэдрэмж төрөхөд зөв бурууг бодохоосоо өмнө хийчихдэг.","Галат 5:21; Матт 6:19–24"],
["Хоол, архи, зугаа цэнгэл, худалдаа, тоглоом, интернет, бэлгийн хүсэл зэрэг зүйлсийн аль нэг нь намайг хянах үе байдаг.","Галат 5:21; Матт 6:19–24"],
["Би буруу зүйл хийсэн үедээ “би яагаад ингэхээс өөр аргагүй байсан” гэж өөрийгөө зөвтгөх хандлагатай.","Матт 7:1–5; 5:23–24"],
["Намайг засах үед эхлээд өөрийн бурууг харахаас илүү нөгөө хүний бурууг олдог.","Матт 7:1–5; 5:23–24"]
];
const L=["Бараг хэзээ ч үгүй","Ховор","Заримдаа","Ихэнхдээ","Бараг үргэлж"];
const ans=Array(36).fill(0);let cur=-1;
const app=document.getElementById('app');
const $=s=>document.querySelector(s);
function intro(){cur=-1;app.innerHTML=`<div class="card">
<h1>Библийн зан чанарын өөрийгөө шалгах тест</h1>
<p class="sub">Матт 5–7 + Галат 5 · 36 асуулт · ойролцоогоор 10 минут</p>
<div class="quote"><b>“Миний зүрхнээс одоо юу илүү их гарч байна вэ?”</b><br>Матт 7:16-ын зарчим ёсоор хүнийг жимсээр нь таньдаг. Энэ тест таны юу гэж боддогийг бус, бодит амьдрал дээр ямар хариу үйлдэл гаргадагийг шалгана.</div>
<p>Сүүлийн <b>3 сарын</b> бодит амьдралаа бодож хариулна.</p>
<ul class="scale">${L.map((t,i)=>`<li><b>${i+1}</b><span>${t}</span></li>`).join('')}</ul>
<p><b>Маш чухал:</b> “Би ийм хүн байхыг хүсдэг” гэж биш, <b>“Би үнэхээр ингэж амьдардаг уу?”</b> гэж хариул. Ялангуяа хэн ч харахгүй үед, уурласан, гомдсон үед, мөнгө/эрх мэдэлтэй харьцах үед, хүнд сорилт ирэх үед ямар байдгаа бод.</p>
<p class="note">Өөрийгөө хуурахгүй, бусдыг үнэлэхгүй, өөрийн хэв маягийг шалгах зорилготой. Үр дүнг хамгийн сүүлд харуулна.</p>
<div class="acts"><button class="btn" onclick="go(0)">Тест эхлэх</button></div></div>`}
function go(i){cur=i;const sec=i<18?"Сүнсний жимс":"Махбодын үйлс";const cat=(i<18?F:M)[Math.floor((i%18)/2)];
app.innerHTML=`<div class="card"><div class="top"><span>Асуулт ${i+1} / 36</span><span>${Math.round(i/36*100)}%</span></div>
<div class="bar"><i style="width:${i/36*100}%"></i></div>
<div class="sec-t">${sec}</div>
<div class="q">${Q[i][0]}</div><div class="ref">Библийн суурь: ${Q[i][1]}</div>
<div class="opts">${L.map((t,k)=>`<button class="opt ${ans[i]==k+1?'on':''}" onclick="pick(${k+1})"><b>${k+1}</b>${t}</button>`).join('')}</div>
<div class="nav"><button class="btn sec" onclick="${i?`go(${i-1})`:'intro()'}">← Буцах</button>
<button class="btn" id="nx" ${ans[i]?'':'disabled'} onclick="next()">${i==35?'Үр дүн харах':'Дараах →'}</button></div></div>`}
function pick(v){ans[cur]=v;document.querySelectorAll('.opt').forEach((b,k)=>b.classList.toggle('on',k+1==v));$('#nx').disabled=false;setTimeout(()=>{if(ans[cur]==v)next()},280)}
let busy=false;
function next(){if(!ans[cur])return;cur<35?go(cur+1):result()}
function sc(arr,off){return arr.map((_,j)=>ans[off+j*2]+ans[off+j*2+1])}
const fl=s=>s>=9?"Маш хүчтэй илэрч байна":s>=7?"Сайн хөгжсөн":s>=5?"Дунд, өсөх боломжтой":s>=3?"Сул тал байна":s==2?"Маш сул":"Бараг илрээгүй";
const ml=s=>s>=10?"Нэн тэргүүнд ажиллах талбар":s>=8?"Хүчтэй хэв маяг":s>=6?"Анхаарах хэрэгтэй":s>=4?"Хааяа илэрдэг":"Бага илэрч байна";
const rows=(names,em,s,cls)=>names.map((n,i)=>`<div class="row ${cls}"><div class="l"><span>${em[i]} ${n}</span><span>${s[i]}/10</span></div><div class="t"><i style="width:${s[i]*10}%"></i></div></div>`).join('');
function rank(s,desc){return s.map((v,i)=>[v,i]).sort((a,b)=>desc?b[0]-a[0]:a[0]-b[0]).slice(0,3)}
const PAIRS=[[0,2],[3,5],[2,3],[6,1],[7,8],[8,7]];
let REPORT="";
function result(){const f=sc(F,0),m=sc(M,18);
const sf=rank(f,1),wf=rank(f,0),tm=rank(m,1);
const line=(r,names,em,lab)=>r.map(([v,i])=>`<div><span>${em[i]} ${names[i]}</span><b>${v}/10</b></div>`).join('');
let ins="";PAIRS.forEach(([a,b])=>{if(f[a]>=7&&m[b]>=6)ins+=`<div class="ins"><b>${F[a]} ${f[a]}/10</b> гэхдээ <b>${M[b]} ${m[b]}/10</b> → ${F[a]} сайн илэрдэг боловч ${M[b].toLowerCase()}-ийн хэв маяг мөн хүчтэй байна. Энэ хоёр хоорондоо тэмцэж байгааг анхаар.</div>`;
else if(f[a]<=4&&m[b]>=6)ins+=`<div class="ins"><b>${F[a]} ${f[a]}/10</b> ба <b>${M[b]} ${m[b]}/10</b> → ${F[a]} төлөвшөөгүй байгаа нь ${M[b].toLowerCase()}-ийн хэв маягтай шууд холбоотой байж болно.</div>`});
if(f[0]>=7&&f[8]<=5)ins+=`<div class="ins"><b>Хайр ${f[0]}/10</b> гэхдээ <b>Биеэ захирах ${f[8]}/10</b> → Зүрхэнд сайн хүсэл байгаа боловч тэр нь амьдралын тогтвортой дадал болоход өсөлт хэрэгтэй.</div>`;
if(!ins)ins=`<div class="ins">Энэ удаад хүчтэй зөрчил илрээгүй. Хамгийн хүчтэй махбодын хэв маягаа бодитойгоор харж, тодорхой нэг алхам сонго.</div>`;
const tw=m[tm[0][1]],ta=sf[0][1];
REPORT=`🧾 МИНИЙ БИБЛИЙН ЗАН ЧАНАРЫН ТАЙЛАН\n1. Хамгийн хүчтэй зан чанар: ${F[sf[0][1]]} — ${sf[0][0]}/10\n2. Хоёр дахь: ${F[sf[1][1]]} — ${sf[1][0]}/10\n3. Хамгийн их өсөх хэрэгтэй: ${F[wf[0][1]]} — ${wf[0][0]}/10\n4. Хамгийн хүчтэй махбодын тэмцэл: ${M[tm[0][1]]} — ${tm[0][0]}/10\n5. Хоёр дахь тэмцэл: ${M[tm[1][1]]} — ${tm[1][0]}/10\n6. Тунгаах хэсэг: Матт 5–7; Галат 5`;
app.innerHTML=`<div class="card"><h1>Таны зан чанарын зураг</h1>
<p class="sub">Энэ нь “сайн хүн / муу хүн” гэсэн дүгнэлт биш. Хаана жимс боловсорч, хаана махбод удирдаж байгааг харуулсан зураг.</p>
<h2>1. Миний хамгийн хүчтэй 3 сүнслэг зан чанар</h2><div class="top3">${line(sf,F,FE)}</div>
<h2>2. Миний хамгийн сул 3 сүнслэг зан чанар</h2><div class="top3">${line(wf,F,FE)}</div>
<p class="note">1 оноо авсан нь муу хүн гэсэн үг биш. Энэ зан чанар амьдралд хангалттай төлөвшөөгүй гэсэн дохио.</p>
<h2>3. Миний хамгийн их илэрч буй 3 махбодын хэв маяг</h2><div class="top3">${line(tm,M,ME)}</div>
<p class="note">Энэ нь “Би муу хүн” биш, харин “миний махбодын хамгийн хүчтэй тэмцэл энд байна” гэсэн үг.</p>
<h2>Сүнсний жимс — бүх оноо</h2>${rows(F,FE,f,'f')}
<div class="tbl"><table>${F.map((n,i)=>`<tr><td>${n}</td><td>${f[i]}/10</td><td>${fl(f[i])}</td></tr>`).join('')}</table></div>

<div class="tbl"><table>${M.map((n,i)=>`<tr><td>${n}</td><td>${m[i]}/10</td><td>${ml(m[i])}</td></tr>`).join('')}</table></div>
<h2>4. Илүү гүн дүгнэлт</h2>${ins}
<h2>Миний дараагийн алхам</h2>
<div class="quote"><b>Гол асуулт:</b> “${M[tm[0][1]]} хүчтэй байгаа үед миний ${F[ta]} хэвээр үлдэж чадаж байна уу?”</div>
<textarea id="step" placeholder="Энэ долоо хоногт би... (жишээ: уурласан үедээ шууд хариу өгөхийн оронд эхлээд тайван байж, эвлэрлийг эрэлхийлнэ)"></textarea>
<div class="quote">Тунгаах Библийн хэсэг: <b>Матт 5–7; Галат 5</b></div>
<p class="note">Хүн хайртай боловч ууртай байж болно; итгэлтэй боловч санаа зовнилтой байж болно; даруу боловч өөрийгөө зөвтгөж болно. Зорилго нь “Би сайн хүн үү?” гэдгийг биш, “Би аль хэсэгт өсөх хэрэгтэй вэ?” гэдгийг олох явдал.</p>
<div class="acts"><button class="btn" onclick="cp()" id="cpb">Тайлан хуулах</button><button class="btn sec" onclick="window.print()">Хэвлэх</button><button class="btn sec" onclick="restart()">Дахин өгөх</button></div></div>`;window.scrollTo(0,0)}
function cp(){const t=REPORT+"\n7. Дараагийн алхам: "+($('#step').value||"—");const b=$('#cpb');
const ok=()=>{b.textContent="Хуулагдлаа ✓";setTimeout(()=>b.textContent="Тайлан хуулах",1800)};
try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}
function fb(){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){}a.remove()}}
function restart(){ans.fill(0);intro()}
intro();
</script>
